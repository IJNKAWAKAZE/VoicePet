[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepet"
version = "0.1.0"
description = "Windows 桌面语音管家的运行时基础"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
voicepet = "app:main"

[project.optional-dependencies]
agent = [
    "openai-codex==0.147.0",
    "psutil>=7,<8",
    "pycaw>=20240210",
    "send2trash>=1.8,<2",
    "screen-brightness-control>=0.24,<1",
]
audio = [
    "sounddevice>=0.5.6,<0.6",
    "webrtcvad-wheels>=2.0.14,<3",
]
asr = [
    "faster-whisper>=1.2.1,<2",
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "numpy>=1.26,<3",
]
wake = [
    "numpy>=1.26,<3",
    "pypinyin>=0.55,<0.56",
    "sentencepiece>=0.2.1,<0.3",
    "sherpa-onnx>=1.13.7,<1.14",
]
llm = [
    "openai>=3.7,<4",
]
tts = [
    "edge-tts>=7.2.8,<8",
    "pywin32>=311,<312",
]
ui = [
    "PySide6>=6.9,<7",
]
build = [
    "pyinstaller>=6.15,<7",
]
dev = [
    "pillow>=11,<13",
    "pytest>=8,<10",
    "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["core", "core.*", "ui", "ui.*"]
namespaces = false

[tool.setuptools.package-data]
ui = ["qml/**/*.qml", "qml/**/*.svg", "qml/**/*.txt"]

[tool.setuptools.data-files]
"assets/ui/brand" = ["assets/ui/brand/*.svg", "assets/ui/brand/*.ico"]
"assets/ui/themes/sunny_sea" = ["assets/ui/themes/sunny_sea/*.webp"]
"assets/ui/themes/deep_night" = ["assets/ui/themes/deep_night/*.webp"]
"assets/ui/themes/sakura_coral" = ["assets/ui/themes/sakura_coral/*.webp"]

[tool.ruff.lint.per-file-ignores]
"VoicePet.spec" = ["F821"]
